name: detector-research

# Two-stage weekly research pipeline:
#
#   Stage 1 (bin/detector-research.py): discovers new URLs from the curated
#     public-source list and writes the fresh-URL list to .research-fresh.json
#     (handoff artifact, committed). Does NOT file per-URL issues.
#   Stage 2 (bin/detector-synthesize.py): fetches each fresh URL, asks Claude
#     whether it suggests a new tokenmin detector, files a properly-formatted
#     research-candidate issue only on genuine signals + appends to the weekly
#     digest issue.
#
# Runs WEEKLY in the cloud (GitHub Actions) — survives laptop shutdown by design.
# Source list lives at bin/sources.json (PR there to add a source); the synthesis
# prompt lives at bin/synthesis-prompt.md so editorial changes are one-line diffs.
#
# OPTIONAL SECRET: ANTHROPIC_API_KEY — add via
#   gh secret set ANTHROPIC_API_KEY --repo watsonrm/tokenmin-scanner
#
# When ANTHROPIC_API_KEY is set:
#   Stage 1 hands off fresh URLs to Stage 2; Claude reads each URL and files
#   structured candidate issues only on genuine signals.
#
# When ANTHROPIC_API_KEY is NOT set:
#   The workflow falls back to legacy-mode: Stage 1 files one issue per fresh
#   URL (noisier but useful — the prior v0.12.5 behavior). Stage 2 is skipped.
#
# Either way, the cron produces value. Setting the secret upgrades quality
# from "every URL gets an issue" to "Claude says this URL is worth an issue."

on:
  schedule:
    # Mondays at 13:23 UTC. Off the :00/:30 minute marks so we don't slam the
    # cron fleet at the round-hour like everyone else.
    - cron: '23 13 * * 1'
  workflow_dispatch: {}  # manual trigger for the first run + debugging

permissions:
  contents: write   # to commit the updated .research-seen.json + .research-fresh.json
  issues: write     # to file research-candidate issues + maintain the weekly digest

concurrency:
  group: detector-research
  cancel-in-progress: false

jobs:
  scan-and-file:
    runs-on: ubuntu-latest
    # Bridge the secret-availability check into an env var so step-level `if:`
    # conditions can read it (GitHub Actions doesn't allow `secrets.*` in `if:`).
    env:
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure 'research-candidate' label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh label list --repo "${GITHUB_REPOSITORY}" --search research-candidate \
              | grep -q '^research-candidate'; then
            gh label create research-candidate \
              --repo "${GITHUB_REPOSITORY}" \
              --description "Auto-filed by detector-research; review for tokenmin detector ideas" \
              --color "C5DEF5" || true
          fi

      - name: Stage 1 — detector-research (URL discovery)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "${HAS_ANTHROPIC_KEY}" == "true" ]]; then
            echo "ANTHROPIC_API_KEY present — Stage 1 hands off to Stage 2."
            python3 bin/detector-research.py
          else
            echo "ANTHROPIC_API_KEY not set — running Stage 1 in legacy file-per-URL mode."
            python3 bin/detector-research.py --legacy-file-issues
          fi

      - name: Stage 2 — detector-synthesize (Claude-judged candidates)
        # Skip entirely when the API key isn't configured — Stage 1 already
        # handled filing in legacy mode.
        if: env.HAS_ANTHROPIC_KEY == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Soft cost cap per run in USD. When cumulative API spend crosses this,
          # the remaining fresh URLs are recorded in the digest as "not triaged
          # this week" and deferred to the next cron.
          TOKENMIN_SYNTH_BUDGET: "1.00"
          # Model selector. claude-sonnet-4-6 is the default; switch to
          # claude-haiku-4-5 for ~8x cheaper synthesis if the prompt holds up.
          TOKENMIN_SYNTH_MODEL: "claude-sonnet-4-6"
        run: python3 bin/detector-synthesize.py

      - name: Commit updated state (if changed)
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain bin/.research-seen.json bin/.research-fresh.json)" ]]; then
            echo "no state changes; nothing to commit"
            exit 0
          fi
          git config user.name  "tokenmin-detector-research"
          git config user.email "tokenmin-research@users.noreply.github.com"
          git add bin/.research-seen.json bin/.research-fresh.json
          git commit -m "research: update seen + fresh state ($(date -u +%Y-%m-%d))"
          # Stage 2 can take minutes; main may have moved during the run.
          # Rebase + retry to survive a push race.
          for attempt in 1 2 3; do
            if git pull --rebase --quiet origin main && git push origin main; then
              echo "state committed (attempt ${attempt})"
              exit 0
            fi
            echo "push race (attempt ${attempt}), retrying..."
            sleep 5
          done
          echo "::warning::state push lost the race 3 times — state will be re-derived next run"
